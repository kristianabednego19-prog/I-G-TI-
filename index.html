<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingetin - Reminder Tugas Kuliah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Font untuk kesan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .supabase-card {
            background: linear-gradient(145deg, rgba(99, 6, 106, 0.9), rgba(2, 6, 23, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .supabase-input {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        .supabase-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
            outline: none;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-[#030712] min-h-screen text-slate-100 flex items-center justify-center p-4 sm:p-6 relative">

    <div class="max-w-xl w-full mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-block px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold tracking-wider uppercase mb-3">
                KELOMPOK 2
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">IПGΣTIП<span class="text-sky-400">.</span></h1>
            <p class="text-sm text-slate-400 mt-1">Platform Pengingat Tugas Pribadi Anda</p>
        </header>

        <!-- Bagian Identitas Pengguna -->
        <section id="identity-section" class="supabase-card rounded-2xl p-6 sm:p-8 backdrop-blur-xl mb-6">
            <h2 class="text-lg font-semibold mb-2 text-white">Identitas Mahasiswa</h2>
            <p class="text-xs text-slate-400 mb-6">Masukkan data Anda sekali, tersimpan otomatis di perangkat ini.</p>
            
            <form id="identity-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">ID / Nama Mahasiswa</label>
                    <input type="text" id="student_id" required placeholder="Contoh: joko_widodo" class="supabase-input w-full px-4 py-2.5 rounded-xl text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Nomor WhatsApp (Format: 628xxx)</label>
                    <input type="text" id="whatsapp_number" required placeholder="Contoh: 6281234567890" class="supabase-input w-full px-4 py-2.5 rounded-xl text-sm transition">
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-2.5 rounded-xl transition shadow-lg shadow-sky-500/20 text-sm">Simpan Identitas</button>
            </form>
        </section>

        <!-- Bagian Utama Aplikasi -->
        <div id="main-app" class="hidden space-y-6">
            <div class="supabase-card rounded-2xl p-4 flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-sky-400 font-bold uppercase tracking-wider">Mahasiswa Aktif</p>
                    <p id="display-identity" class="text-sm font-semibold text-white mt-0.5"></p>
                </div>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-xl transition font-medium">Ganti</button>
            </div>

            <!-- Form Tambah Tugas -->
            <section class="supabase-card rounded-2xl p-6 sm:p-8">
                <h2 class="text-lg font-semibold mb-4 text-white">Tambah Tugas Baru</h2>
                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Mata Kuliah</label>
                        <input type="text" id="course" required placeholder="Contoh: Pendidikan Pancasila" class="supabase-input w-full px-4 py-2.5 rounded-xl text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Judul / Detail Tugas</label>
                        <input type="text" id="title" required placeholder="Contoh: Analisis Kasus Sila ke-4" class="supabase-input w-full px-4 py-2.5 rounded-xl text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Batas Waktu (Deadline)</label>
                        <input type="datetime-local" id="deadline" required class="supabase-input w-full px-4 py-2.5 rounded-xl text-sm transition text-white">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-sky-500/25 text-sm">Tambah & Jadwalkan Pengingat</button>
                </form>
            </section>

            <!-- Daftar Tugas Aktif -->
            <section class="supabase-card rounded-2xl p-6 sm:p-8">
                <h2 class="text-lg font-semibold mb-4 text-white">Daftar Tugas Anda</h2>
                <div id="task-list" class="space-y-3">
                    <p class="text-sm text-slate-500 text-center py-4">Memuat tugas...</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal Efek Sukses -->
    <div id="success-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden transition-opacity duration-300">
        <div class="supabase-card p-8 rounded-3xl text-center max-w-sm mx-4 transform scale-95 transition-transform duration-300 shadow-2xl border border-emerald-500/30">
            <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">Berhasil!</h3>
            <p class="text-sm text-slate-300">Tugas Berhasil Dicatat & Pengingat Diaktifkan.</p>
        </div>
    </div>

    <!-- Script Logika Aplikasi -->
    <script>
        const SUPABASE_URL = 'https://uxmaxhusihcolqksmiyf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_cjdPtrqpbMYSxAEGaEW41Q_q74K_-nI';
        
        // Menggunakan nama 'supabaseClient' agar tidak bentrok dengan fungsi global CDN
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudentId = localStorage.getItem('ingetin_student_id');
        let currentWhatsapp = localStorage.getItem('ingetin_whatsapp');

        const identitySection = document.getElementById('identity-section');
        const mainApp = document.getElementById('main-app');
        const identityForm = document.getElementById('identity-form');
        const taskForm = document.getElementById('task-form');
        const taskList = document.getElementById('task-list');
        const successModal = document.getElementById('success-modal');

        if (currentStudentId && currentWhatsapp) {
            showMainApp();
        }

        identityForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const sId = document.getElementById('student_id').value.trim();
            const wa = document.getElementById('whatsapp_number').value.trim();

            if (!sId || !wa) return alert('Semua kolom harus diisi!');

            localStorage.setItem('ingetin_student_id', sId);
            localStorage.setItem('ingetin_whatsapp', wa);

            currentStudentId = sId;
            currentWhatsapp = wa;

            showMainApp();
        });

        function showMainApp() {
            identitySection.classList.add('hidden');
            mainApp.classList.remove('hidden');
            document.getElementById('display-identity').innerText = `${currentStudentId} (${currentWhatsapp})`;
            loadTasks();
        }

        function logout() {
            localStorage.removeItem('ingetin_student_id');
            localStorage.removeItem('ingetin_whatsapp');
            location.reload();
        }

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const course = document.getElementById('course').value;
            const title = document.getElementById('title').value;
            const deadline = document.getElementById('deadline').value;

            if (!course || !title || !deadline) return alert('Lengkapi semua data tugas!');

            const deadlineISO = new Date(deadline).toISOString();

            const { error } = await supabaseClient.from('tasks').insert([
                {
                    student_id: currentStudentId,
                    whatsapp_number: currentWhatsapp,
                    course: course,
                    title: title,
                    deadline: deadlineISO
                }
            ]);

            if (error) {
                alert('Gagal menambah tugas: ' + error.message);
            } else {
                taskForm.reset();
                successModal.classList.remove('hidden');
                setTimeout(() => {
                    successModal.classList.add('hidden');
                    loadTasks();
                }, 1500);
            }
        });

        async function loadTasks() {
            taskList.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">Memuat tugas...</p>';

            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('student_id', currentStudentId)
                .order('deadline', { ascending: true });

            if (error) {
                taskList.innerHTML = '<p class="text-sm text-red-400 text-center py-4">Gagal memuat data tugas.</p>';
                return;
            }

            if (data.length === 0) {
                taskList.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">Belum ada tugas aktif. Santai dulu!</p>';
                return;
            }

            taskList.innerHTML = '';
            data.forEach(task => {
                const deadlineDate = new Date(task.deadline).toLocaleString('id-ID', {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                });

                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-4 bg-slate-900/60 border border-slate-800 rounded-xl';
                item.innerHTML = `
                    <div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 bg-sky-500/10 text-sky-400 border border-sky-500/20 rounded-md">${task.course}</span>
                        <h3 class="font-medium text-white text-sm mt-1.5">${task.title}</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Deadline: ${deadlineDate}</p>
                    </div>
                    <button onclick="finishTask('${task.id}', '${task.title}')" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-xs font-medium px-3 py-2 rounded-xl transition">Selesai</button>
                `;
                taskList.appendChild(item);
            });
        }

        async function finishTask(taskId, taskTitle) {
            if (confirm(`Tandai tugas "${taskTitle}" sebagai selesai dan hapus dari sistem?`)) {
                const { error } = await supabaseClient
                    .from('tasks')
                    .delete()
                    .eq('id', taskId);

                if (error) {
                    alert('Gagal menghapus tugas: ' + error.message);
                } else {
                    loadTasks();
                }
            }
        }
    </script>
</body>
</html>
